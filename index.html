<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EAE6F6" />
    <meta name="author" content="Koldin" />
    <meta name="description" content="Личный дневник питания. Работает без интернета, дневник хранится только на устройстве." />
    <!-- Превью ссылки в мессенджерах (Telegram, WhatsApp, MAX, VK) и соцсетях.
         Адреса абсолютные: боты превью относительные не понимают. Сменится
         домен сайта — поменять og:url и оба адреса картинки. Картинка —
         JPEG до 250 КБ: тяжелее WhatsApp превью не показывает. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Дневник калорий" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://kcal-diary-koldin.netlify.app/" />
    <meta property="og:title" content="Дневник калорий" />
    <meta property="og:description" content="Калории, БЖУ, вода и вес. Работает без интернета, записи хранятся только на телефоне." />
    <meta property="og:image" content="https://kcal-diary-koldin.netlify.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Золотое кольцо с листом, надпись «Дневник калорий» и подпись By Koldin" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://kcal-diary-koldin.netlify.app/og.jpg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Калории" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- default, а не black-translucent: тот рисует часы и батарею белым,
         а основная тема теперь светлая, и на ней белое не читается -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- iOS не читает manifest: иконку для домашнего экрана он берёт только отсюда -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- Ставит тему до первой отрисовки, чтобы запуск не мигал чужим цветом.
         Внешним файлом: CSP запрещает встроенные скрипты. -->
    <script src="/theme.js"></script>
    <title>Дневник калорий</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
